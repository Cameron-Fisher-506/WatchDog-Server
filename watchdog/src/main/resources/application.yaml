spring:
  application:
    name: watchdog

    profiles:
      active: dev

    config:
      activate:
        on-profile: dev

  sql:
    init:
      mode: always

  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/watchdog
    username: postgres
    password: Rolojojo_506
